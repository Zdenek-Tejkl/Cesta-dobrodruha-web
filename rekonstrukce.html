<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Web v rekonstrukci | Cesta dobrodruha</title>
  <meta name="theme-color" content="#221E1A">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 12'%3E%3Cg fill='none' stroke='%23B4501E' stroke-width='2.4'%3E%3Ccircle cx='5' cy='6' r='3.1'/%3E%3Cpath d='M8.1 6 H29' stroke-linecap='round'/%3E%3Cpath d='M25.5 2.5 30.5 6 25.5 9.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --pisek:#F3EDE2; --uhel:#221E1A; --terakota:#B4501E; --kamen:#6E655C; }
    * { box-sizing:border-box; margin:0; }
    html, body { height:100%; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:32px 16px; background:var(--uhel); color:var(--pisek);
      background-image:linear-gradient(rgba(34,30,26,.78), rgba(34,30,26,.9)), url('/assets/hero-velbloudi-800.jpg');
      background-size:cover; background-position:center;
      font-family:'Lora', serif; text-align:center;
    }
    main { max-width:560px; }
    .logo { display:inline-flex; align-items:center; gap:10px; color:var(--terakota);
      font:700 14px/1 'Archivo', sans-serif; letter-spacing:.18em; margin-bottom:40px; }
    .logo span { color:var(--pisek); }
    h1 { font:800 clamp(32px, 7vw, 56px)/1.05 'Archivo', sans-serif; letter-spacing:-.01em; margin-bottom:20px; }
    p { font-size:18px; line-height:1.6; color:#E3DBCD; }
    .en { margin-top:12px; font-size:15px; color:#B9AFA2; font-style:italic; }
    .kontakt { margin-top:36px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
    .kontakt a { display:inline-block; min-height:44px; padding:12px 22px; border-radius:4px;
      font:600 15px/1.3 'Archivo', sans-serif; text-decoration:none; color:var(--pisek);
      border:1px solid rgba(243,237,226,.35); }
    .kontakt a.hlavni { background:var(--terakota); border-color:var(--terakota); }
    .kontakt a:hover { border-color:var(--pisek); }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg width="34" height="12" viewBox="0 0 34 12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="6" r="3.1"></circle><path d="M8.1 6 H29" stroke-linecap="round"></path><path d="M25.5 2.5 30.5 6 25.5 9.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>CESTA DOBRODRUHA</span>
    </div>
    <h1>Web je v rekonstrukci</h1>
    <p>Chystáme novou podobu. Brzy jsme zpět.</p>
    <p class="en">Website under reconstruction. Back soon.</p>
    <div class="kontakt">
      <a class="hlavni" href="tel:+420733392354">+420 733 392 354</a>
    </div>
  </main>
</body>
</html>
